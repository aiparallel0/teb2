- name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GITHUB_SHA,CR_PAT
          script: |
            set -eu
            cd /opt/teb2
            git fetch --all
            git reset --hard origin/main
            export IMAGE_TAG=sha-$(echo "${GITHUB_SHA}" | cut -c1-7)
            echo "${CR_PAT}" | docker login ghcr.io -u aiparallel0 --password-stdin
            grep -q '^IMAGE_TAG=' .env \
              && sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env \
              || echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            # The portearchive.com droplet runs host nginx on :80/:443,
            # so we only (re)deploy the `app` service on the loopback
            # port declared in ops/portearchive/compose.yml. Starting the
            # base compose's `nginx` service here would collide with the
            # host nginx and fail with "address already in use".
            COMPOSE_FILES="-f docker-compose.yml -f ops/portearchive/compose.yml"
            docker compose $COMPOSE_FILES pull app
            docker compose $COMPOSE_FILES up -d --remove-orphans app
        env:
          GITHUB_SHA: ${{ github.sha }}
          CR_PAT: ${{ secrets.CR_PAT }}
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev libcrypt-dev libssl-dev

      - name: Compile
        run: make clean && make

      - name: Enforce 166-line cap
        run: |
          fail=0
          for f in $(find . -name '*.c' -o -name '*.h' | grep -v '.git/'); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 166 ]; then
              echo "FAIL: $f has $lines lines (max 166)"
              fail=1
            fi
          done
          exit $fail

      - name: Eval harness (schema / fixture drift)
        run: bash evals/run.sh

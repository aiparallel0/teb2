name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev libcrypt-dev

      - name: Build
        run: make clean && make

      - name: Check line counts
        run: |
          fail=0
          for f in $(find . -name '*.c' -o -name '*.h' | grep -v '.git/'); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 166 ]; then
              echo "FAIL: $f has $lines lines (max 166)"
              fail=1
            fi
          done
          exit $fail

      - name: Verify binary exists
        run: |
          test -x ./teb2
          ls -lh ./teb2

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t teb2:ci .

      - name: Smoke test container
        run: |
          docker run -d --name teb2-test -p 8080:8080 teb2:ci
          sleep 2
          curl -sf http://localhost:8080/healthz | grep '"status":"ok"'
          docker stop teb2-test

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>teb2</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
<h1>teb2</h1>
<div id="auth-bar">
<span id="health"></span>
<input id="email" type="text" placeholder="email">
<input id="password" type="password" placeholder="password">
<button onclick="doLogin()">Login</button>
<button onclick="doRegister()">Register</button>
<button class="danger" onclick="doLogout()">Logout</button>
</div>
</header>
<nav>
<button data-view="goals" class="active" onclick="showView('goals')">Goals</button>
<button data-view="tasks" onclick="showView('tasks')">Tasks</button>
<button data-view="finance" onclick="showView('finance')">Finance</button>
<button data-view="collab" onclick="showView('collab')">Collab</button>
<button data-view="dash" onclick="showView('dash')">Dashboard</button>
<button data-view="community" onclick="showView('community')">Community</button>
<button data-view="workflows" onclick="showView('workflows')">Workflows</button>
<button data-view="measure" onclick="showView('measure')">Measure</button>
</nav>
<main>
<div id="error-bar"></div>
<!-- Goals -->
<div id="v-goals" class="view active">
<div class="section"><h2>Goals</h2>
<div class="row"><input id="goal-title" placeholder="Goal title">
<input id="goal-desc" placeholder="Description (optional)">
<button class="btn btn-green" onclick="createGoal()">Add Goal</button></div>
<div id="goal-list"></div></div>
<div class="section" id="goal-detail"></div>
<div id="goal-tasks"></div>
</div>
<!-- Tasks -->
<div id="v-tasks" class="view">
<div class="section"><h2>Tasks</h2>
<div class="row"><input id="task-filter-goal" placeholder="Goal ID" style="max-width:6rem">
<button class="btn btn-blue" onclick="load_tasks()">Filter</button></div>
<div class="row"><input id="task-title" placeholder="Task title">
<input id="task-goal-id" placeholder="Goal ID" style="max-width:6rem">
<input id="task-desc" placeholder="Description">
<button class="btn btn-green" onclick="createTask()">Add Task</button></div>
<div id="task-list"></div></div>
<div id="task-detail"></div>
</div>
<!-- Finance -->
<div id="v-finance" class="view">
<div class="section"><h2>Budget</h2>
<div class="row"><input id="budget-amount" placeholder="Limit ($)" style="max-width:8rem">
<button class="btn btn-green" onclick="createBudget()">Set Budget</button>
<input id="spend-amount" placeholder="Spend ($)" style="max-width:8rem">
<button class="btn btn-red" onclick="recordSpend()">Record</button></div>
<div id="budget-list"></div></div>
<div class="section"><h2>Schedules</h2>
<div class="row"><input id="sched-task" placeholder="Task ID" style="max-width:6rem">
<input id="sched-time" type="datetime-local">
<button class="btn btn-blue" onclick="createSchedule()">Schedule</button></div>
<div id="sched-list"></div></div>
</div>
<!-- Collab -->
<div id="v-collab" class="view">
<div class="section"><h2>Workspaces</h2>
<div class="row"><input id="ws-name" placeholder="Workspace name">
<button class="btn btn-green" onclick="createWorkspace()">Create</button></div>
<div id="ws-list"></div></div>
<div class="section"><h2>Collaborators</h2>
<div class="row"><input id="collab-ws" placeholder="WS ID" style="max-width:5rem">
<input id="collab-user" placeholder="User ID">
<input id="collab-role" placeholder="Role" value="member" style="max-width:6rem">
<button class="btn btn-blue" onclick="addCollab()">Add</button></div></div>
<div class="section"><h2>Chat</h2>
<div class="row"><input id="chat-ws" placeholder="WS ID" value="1" style="max-width:5rem">
<button class="btn btn-blue" onclick="load_collab()">Load</button>
<button class="btn btn-green" onclick="startSSE()">Live</button></div>
<div id="chat-messages" class="chat-box"></div>
<div class="row"><input id="chat-input" placeholder="Message">
<button class="btn btn-green" onclick="sendChat()">Send</button></div></div>
<div class="section"><h2>Integrations</h2>
<div class="row"><input id="integ-name" placeholder="Integration name">
<button class="btn btn-blue" onclick="toggleInteg()">Enable</button></div></div>
</div>
<!-- Dashboard -->
<div id="v-dash" class="view">
<div class="section"><h2>Search</h2>
<div class="row"><input id="search-q" placeholder="Search goals and tasks">
<button class="btn btn-blue" onclick="doSearch()">Search</button></div>
<div id="search-results"></div></div>
<div class="section"><h2>Gamification</h2>
<div id="streak-info"></div>
<div class="row"><input id="xp-amount" placeholder="XP" style="max-width:5rem">
<input id="xp-reason" placeholder="Reason">
<button class="btn btn-green" onclick="creditXP()">Award XP</button></div>
<div id="leaderboard"></div></div>
</div>
<!-- Community -->
<div id="v-community" class="view">
<div class="section"><h2>Blog</h2>
<div class="row"><input id="blog-title" placeholder="Post title">
<button class="btn btn-green" onclick="postBlog()">Post</button></div>
<textarea id="blog-body" rows="3" placeholder="Post body"></textarea>
<div id="blog-list" style="margin-top:.75rem"></div></div>
<div class="section"><h2>Feature Votes</h2>
<div class="row"><input id="vote-feature" placeholder="Feature name">
<button class="btn btn-blue" onclick="voteFeat()">Vote</button></div></div>
</div>
<!-- Workflows -->
<div id="v-workflows" class="view">
<div class="section"><h2>Workflow Runs</h2>
<div class="row"><input id="run-goal" placeholder="Goal ID" style="max-width:6rem">
<button class="btn btn-green" onclick="createRun()">Start Run</button></div>
<div id="run-status"></div></div>
</div>
<!-- Measure -->
<div id="v-measure" class="view">
<div class="section"><h2>Outcomes</h2>
<div class="row"><input id="outcome-task" placeholder="Task ID" style="max-width:6rem">
<input id="outcome-result" placeholder="Result description">
<button class="btn btn-green" onclick="storeOutcome()">Store</button></div></div>
<div class="section"><h2>Learnings</h2>
<div class="row"><input id="learn-goal" placeholder="Goal ID" style="max-width:6rem">
<input id="learn-insight" placeholder="Insight">
<button class="btn btn-green" onclick="storeLearning()">Store</button></div></div>
</div>
</main>
<script src="/app.js"></script>
<script src="/goals.js"></script>
<script src="/tasks.js"></script>
<script src="/finance.js"></script>
<script src="/collab.js"></script>
<script src="/dash.js"></script>
</body>
</html>

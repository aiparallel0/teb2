worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 1m;
    server_tokens off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 256;

    upstream teb2 {
        server app:8080;
    }

    # Port 80: ACME challenge + redirect everything else to HTTPS
    server {
        listen 80;
        server_name portearchive.com _;

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Port 443: real site
    server {
        listen 443 ssl;
        http2 on;
        server_name portearchive.com;

        ssl_certificate     /etc/letsencrypt/live/portearchive.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/portearchive.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

        # Health check (no rate limit)
        location = /healthz {
            proxy_pass http://teb2;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
        }

        # Metrics (restrict in production)
        location = /metrics {
            proxy_pass http://teb2;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
        }

        # Auth endpoints - strict rate limit
        location ~ ^/auth/(register|login)$ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://teb2;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
        }

        # SSE endpoints - long-lived connections
        location /sse/ {
            proxy_pass http://teb2;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else -> C server (serves / UI and /api/*)
        location / {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://teb2;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
        }
    }
}

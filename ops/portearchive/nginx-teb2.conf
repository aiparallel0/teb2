# ops/portearchive/nginx-teb2.conf
#
# Host-nginx location snippet for serving teb2 at portearchive.com/teb2/.
# Include this inside the existing server{} block that already serves
# portearchive.com (same block that handles /teb and /fixie), e.g.:
#
#   server {
#       listen 443 ssl http2;
#       server_name portearchive.com;
#       # ... existing ssl + other locations ...
#       include /etc/nginx/snippets/teb2.conf;
#   }
#
# install.sh copies this file to /etc/nginx/snippets/teb2.conf and attempts
# to auto-insert the include line. If auto-insert fails, add it yourself
# and run `nginx -t && systemctl reload nginx`.
#
# Prefix strip: we proxy /teb2/<path> -> 127.0.0.1:${TEB2_LOOPBACK_PORT}/<path>.
# The C server matches on naked paths (/, /app.js, /auth/login, ...) so no
# code changes are required on the container side.

# Serve /teb2 (no trailing slash) -> 301 to /teb2/ so relative asset paths
# in index.html resolve under the subpath instead of the site root.
location = /teb2 {
    return 301 /teb2/;
}

location /teb2/ {
    # Strip the /teb2 prefix before proxying to the container.
    # proxy_pass with a trailing / on the target URL does exactly this.
    proxy_pass http://127.0.0.1:__TEB2_LOOPBACK_PORT__/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /teb2;

    proxy_read_timeout  60s;
    proxy_send_timeout  60s;
    client_max_body_size 1m;
}

# Long-lived SSE streams need buffering off and a 1h read timeout.
# Must be a separate, more specific location so it wins over /teb2/.
location /teb2/sse/ {
    proxy_pass http://127.0.0.1:__TEB2_LOOPBACK_PORT__/sse/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_cache     off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# GitHub webhook receiver. POSTs from github.com with HMAC-signed body.
# Proxied to adnanh/webhook listening on the loopback webhook port.
# Hook id is configured in hooks.json as "teb2-deploy".
location = /hooks/teb2-deploy {
    proxy_pass http://127.0.0.1:__TEB2_WEBHOOK_PORT__/hooks/teb2-deploy;

    proxy_http_version 1.1;
    proxy_set_header Host            $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Hub-Signature $http_x_hub_signature;
    proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    proxy_set_header X-GitHub-Event  $http_x_github_event;
    proxy_set_header X-GitHub-Delivery $http_x_github_delivery;

    proxy_read_timeout 30s;
    client_max_body_size 25m;  # GitHub webhook bodies can be large
}

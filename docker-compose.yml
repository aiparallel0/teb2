services:
  app:
    image: ghcr.io/aiparallel0/teb2:${IMAGE_TAG:-latest}
    build: .          # local fallback for server-setup.sh first boot
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - teb2-data:/app/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${LISTEN_PORT:-80}:80"
      - "${LISTEN_TLS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/acme:/var/www/acme
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./nginx/acme:/var/www/acme
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -z "$${DOMAIN:-}" ]; then
          echo "DOMAIN not set; nothing to do" >&2
          exit 0
        fi
        certbot certonly --webroot -w /var/www/acme \
          -d "$${DOMAIN}" --agree-tos --non-interactive \
          -m "$${CERTBOT_EMAIL:-admin@$${DOMAIN}}"
    environment:
      DOMAIN: ${DOMAIN:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}

volumes:
  teb2-data:

networks:
  internal:
    driver: bridge
